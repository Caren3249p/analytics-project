[project]
name = "analytics-project"
version = "0.1.0"
description = "Proyecto del semestre — Analítica de Datos (pipeline sobre el dataset Olist)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5.1",
    "pandas>=2.2",
    "pandera>=0.35.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (orden de imports)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "W",    # pycodestyle warnings
]

[tool.ruff.format]
quote-style = "double"
